[pytest]
# 测试发现路径
testpaths = tools tests
# Python 文件
python_files = test_*.py validate_*.py
python_classes = Test*
python_functions = test_*

# 输出
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# 标记
markers =
    cards: 卡牌数据相关测试
    enemies: 敌人数据相关测试
    schema: JSON Schema 验证测试
    integration: 集成测试
    unit: 单元测试

# 中文显示
console_output_style = progress
