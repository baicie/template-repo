name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号，例如 v0.1.0'
        required: true
        type: string
      linux:
        description: '构建 Linux 版本'
        required: false
        type: boolean
        default: true
      web:
        description: '构建 Web 版本'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}
  GODOT_IMAGE: barichello/godot-ci:4.2.2

jobs:
  # ─── Linux 构建 ───────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    container:
      image: ${{ env.GODOT_IMAGE }}
    if: inputs.linux != false
    steps:
      - uses: actions/checkout@v4

      - name: 导入项目
        run: godot --headless --import --quit

      - name: 构建 Linux PCK
        run: |
          mkdir -p dist
          godot --headless --export-pack "Linux/X11" dist/zhenyaosi-${{ env.VERSION }}.pck

      - name: 验证构建产物
        run: |
          test -f dist/zhenyaosi-${{ env.VERSION }}.pck
          echo "Size: $(du -h dist/zhenyaosi-${{ env.VERSION }}.pck | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: zhenyaosi-linux-${{ env.VERSION }}
          path: dist/*.pck
          retention-days: 30

  # ─── Web 构建 ─────────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    container:
      image: ${{ env.GODOT_IMAGE }}
    if: inputs.web == true
    steps:
      - uses: actions/checkout@v4

      - name: 导入项目
        run: godot --headless --import --quit

      - name: 构建 Web
        run: |
          mkdir -p dist
          godot --headless --export-release "Web" dist/web/index.html

      - name: 验证构建产物
        run: |
          test -f dist/web/index.html
          echo "Size: $(du -sh dist/web | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: zhenyaosi-web-${{ env.VERSION }}
          path: dist/web/
          retention-days: 30

  # ─── 创建 GitHub Release ───────────────────────────────────────
  create-release:
    name: 创建 Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-web]
    if: always() && (needs.build-linux.result == 'success' || needs.build-web.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: 下载 Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 收集构建产物
        run: find dist -type f -name "*.pck" -o -name "index.html" | head -20

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          draft: true
          prerelease: ${{ contains(env.VERSION, 'alpha') || contains(env.VERSION, 'beta') || contains(env.VERSION, 'rc') }}
          generate_release_notes: true
          files: |
            dist/**/*.pck
            dist/**/index.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
